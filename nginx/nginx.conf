user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr - $request_id [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$request_time"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 26m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Cloudflare must be the only public caller of the origin in production.
  # It supplies CF-Connecting-IP; direct/local traffic falls back to remote_addr.
  map $http_cf_connecting_ip $origin_client_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
  }

  map $http_x_forwarded_proto $origin_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  upstream song_thanh_api {
    server api:4000;
    keepalive 32;
  }

  upstream song_thanh_admin {
    server admin:3001;
    keepalive 16;
  }

  upstream song_thanh_frontend {
    server frontend:3000;
    keepalive 32;
  }

  server {
    listen 80;
    listen [::]:80;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Request-ID $request_id always;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://song_thanh_api/;
      proxy_http_version 1.1;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $origin_client_ip;
      proxy_set_header X-Forwarded-For $origin_client_ip;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $origin_forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
    }

    location /public/ {
      proxy_pass http://song_thanh_api;
      proxy_http_version 1.1;
      proxy_read_timeout 120s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $origin_client_ip;
      proxy_set_header X-Forwarded-For $origin_client_ip;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $origin_forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /admin {
      return 308 /admin/;
    }

    location /admin/ {
      proxy_pass http://song_thanh_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $origin_client_ip;
      proxy_set_header X-Forwarded-For $origin_client_ip;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $origin_forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location / {
      proxy_pass http://song_thanh_frontend;
      proxy_http_version 1.1;
      proxy_read_timeout 120s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $origin_client_ip;
      proxy_set_header X-Forwarded-For $origin_client_ip;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $origin_forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
