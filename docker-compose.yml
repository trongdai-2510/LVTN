name: song-thanh

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-song_thanh_cms}
      POSTGRES_USER: ${POSTGRES_USER:-songthanh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/ddl/song_thanh_deployment_schema_20260730.sql:/docker-entrypoint-initdb.d/001-song-thanh-schema.sql:ro
      - ./database/ddl/song_thanh_deployment_migration_history_20260730.sql:/docker-entrypoint-initdb.d/002-song-thanh-migration-history.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-song_thanh_cms}
      DATABASE_USER: ${POSTGRES_USER:-songthanh}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_SSL: 'false'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in .env}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in .env}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      CORS_ORIGINS: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}
      API_STORAGE_ROOT: /app/storage
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    volumes:
      - api-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:4000
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_ADMIN_BASE_PATH: /admin
    restart: unless-stopped
    init: true
    environment:
      API_BASE_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_ADMIN_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}/admin
    restart: unless-stopped
    init: true
    environment:
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HOST_HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      admin:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres-data:
  api-storage:

networks:
  backend:
    driver: bridge
